# Supabase Configuration
# Used by Supabase CLI for local development (supabase start)
# and cloud deployment (supabase db push)

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
max_rows = 1000

[db]
port = 5432
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "http://localhost:3001/auth/callback"
]
jwt_expiry = 3600
password_min_length = 8

[functions]
# Enable Edge Functions for local development

[realtime]
enabled = true
max_bytes_per_second = 1000000

[storage]
file_size_limit = 52428800  # 50MB
