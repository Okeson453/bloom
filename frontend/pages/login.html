<div id="login" class="page">
  <div class="auth-section">
    <div class="auth-card">
      <div class="auth-logo">🌱 Bloom Finance</div>
      <h2 class="auth-title">Welcome back</h2>
      <p class="auth-sub">Log in to track your portfolio and keep growing.</p>
      <div class="social-btns">
        <button class="social-btn">🍎 Apple</button>
        <button class="social-btn">G Google</button>
      </div>
      <div class="divider"><span>or continue with email</span></div>
      <div class="form-group"><label class="form-label">Email Address</label><input class="form-input" type="email" placeholder="you@example.com"/></div>
      <div class="form-group"><label class="form-label">Password</label><input class="form-input" type="password" placeholder="Enter your password"/></div>
      <div style="text-align:right;margin:-6px 0 14px"><a href="#" style="font-size:.8rem;color:var(--green);font-weight:600">Forgot password?</a></div>
      <button class="form-submit" onclick="showPage('dashboard',null)">Log In →</button>
      <div class="auth-switch">Don't have an account? <a onclick="showPage('signup',null)">Sign up free</a></div>
    </div>
  </div>
</div>
