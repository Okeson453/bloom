<div id="signup" class="page">
  <div class="auth-section">
    <div class="auth-card">
      <div class="auth-logo">🌱 Bloom Finance</div>
      <h2 class="auth-title">Start growing today</h2>
      <p class="auth-sub">Open your free account in under 2 minutes.</p>
      <div class="social-btns">
        <button class="social-btn">🍎 Apple</button>
        <button class="social-btn">G Google</button>
      </div>
      <div class="divider"><span>or sign up with email</span></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="form-group"><label class="form-label">First Name</label><input class="form-input" type="text" placeholder="Alex"/></div>
        <div class="form-group"><label class="form-label">Last Name</label><input class="form-input" type="text" placeholder="Johnson"/></div>
      </div>
      <div class="form-group"><label class="form-label">Email Address</label><input class="form-input" type="email" placeholder="you@example.com"/></div>
      <div class="form-group"><label class="form-label">Password</label><input class="form-input" type="password" placeholder="Create a strong password"/></div>
      <button class="form-submit" onclick="showPage('dashboard',null)">Create Free Account →</button>
      <p style="font-size:.72rem;color:var(--text3);text-align:center;margin-top:12px">By signing up you agree to our Terms of Service and Privacy Policy.</p>
      <div class="auth-switch">Already have an account? <a onclick="showPage('login',null)">Log in</a></div>
    </div>
  </div>
</div>
