<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>

<link rel="stylesheet" href="css/tokens.css"/>

<body>

<nav class="nav">
  <div class="nav-logo">
    <svg viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="16" fill="#e8f5ef"/><path d="M8 20 L12 14 L17 17 L22 10 L26 12" stroke="#0A6C4B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="22" cy="10" r="3" fill="#14B8A6"/></svg>
    Bloom
  </div>
  <div class="nav-links">
    <a href="#" class="active" onclick="showPage('home',this)">Home</a>
    <a href="#" onclick="showPage('invest',this)">Invest</a>
    <a href="#" onclick="showPage('learn',this)">Learn</a>
    <a href="#" onclick="showPage('markets',this)">Markets</a>

  <div class="nav-actions">
    <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">🌙</button>
    <button class="btn btn-ghost" onclick="showPage('login',document.querySelector('.nav-links a:last-child'))">Log in</button>
